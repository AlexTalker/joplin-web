name: Build & deploy the latest Joplin Web
on:
  workflow_dispatch:

jobs:
  build-static:
    name: Build the latest Joplin Web
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      -
        name: Fetch the repo
        run: |
          make all

      -
        name: Build Docker image
        id: docker-buildx
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          file: joplin-web.dockerfile
          tags: joplin-web:latest

      -
        name: Check the image
        run: |
          docker images -a;
          echo ${{ steps.docker-buildx.outputs.imageid }};

      - name: Copy static
        run: |
          docker create --name=tmp joplin-web:latest noop &&
          docker cp tmp:/static . &&
          docker rm tmp ;

      - name: Check the static
        run: |
          ls -lah ;
          ls -lah ./static/ ;

      - name: Upload the static as artifact
        uses: actions/upload-artifact@v4
        with:
          name: joplin-web
          path: ./static/

      - name: Prepare the static for GitHub Pages
        id: deployment
        uses: actions/upload-pages-artifact@v4 # or specific "vX.X.X" version tag for this action
        with:
          path: ./static/
