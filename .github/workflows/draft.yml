name: Build & deploy the latest Joplin Web
on:
  workflow_dispatch:

jobs:
  build-static:
    name: Build the latest Joplin Web
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      -
        name: Build Docker image
        id: docker-buildx
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          file: joplin-web.dockerfile
          tags: joplin-web:latest

      - name: Check the image
        run: |
          docker images -a;
          echo ${{ steps.docker-buildx.outputs.imageid }};

      - name: Copy static
        run: |
          docker create --name=tmp joplin-web:latest &&
          docker cp tmp:/static/ . &&
          docker rm tmp ;

      - name: Check the static
        run: |
          ls -lah ;
          ls -lah ./static/ ;
